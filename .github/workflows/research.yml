name: Strategy Lab research cycle

on:
  workflow_dispatch:
    inputs:
      inst_id:
        description: "OKX Spot USDT instrument"
        required: true
        default: "SOL-USDT"
      bar:
        description: "Candle interval (ALL = every supported OKX timeframe)"
        required: true
        default: "ALL"
      candles:
        description: "Confirmed historical candles (120-10000)"
        required: true
        default: "1500"

permissions:
  contents: write
  actions: write

concurrency:
  group: strategy-lab-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout persistent research state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify code and tests
        run: python -m pytest -q
      - name: Run 200 sequential research cycles and save every cycle
        env:
          INPUT_INST_ID: ${{ github.event.inputs.inst_id || 'SOL-USDT' }}
          INPUT_BAR: ${{ github.event.inputs.bar || 'ALL' }}
          INPUT_CANDLES: ${{ github.event.inputs.candles || '1500' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase each saved research commit onto the latest main before pushing.
          # Retry in case another writer updates main between fetch and push.
          push_research_commit() {
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "Syncing research commit with origin/main (attempt $attempt/5)"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Rebase conflict while saving research data. Local research commit was not force-pushed."
                git rebase --abort || true
                return 1
              fi
              if git push origin HEAD:main; then
                echo "Research state saved successfully."
                return 0
              fi
              echo "Push rejected because main moved; fetching and retrying."
              sleep "$attempt"
            done
            echo "::error::Could not push research state after 5 attempts."
            return 1
          }

          for cycle in $(seq 1 200); do
            echo "========== Batch cycle $cycle / 200 =========="
            python scripts/split_large_data.py restore
            python main.py --inst-id "$INPUT_INST_ID" --bar "$INPUT_BAR" --candles "$INPUT_CANDLES"
            python scripts/split_large_data.py split
            git add -A data/
            if ! git diff --cached --quiet; then
              git commit -m "Strategy Lab cycle ${cycle}/200 [skip ci]"
              push_research_commit
            else
              echo "No changed research files in this cycle."
            fi
          done
      - name: Start the next 200-cycle workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_INST_ID: ${{ github.event.inputs.inst_id || 'SOL-USDT' }}
          INPUT_BAR: ${{ github.event.inputs.bar || 'ALL' }}
          INPUT_CANDLES: ${{ github.event.inputs.candles || '1500' }}
        run: |
          gh workflow run research.yml --ref main \
            -f inst_id="$INPUT_INST_ID" \
            -f bar="$INPUT_BAR" \
            -f candles="$INPUT_CANDLES"
          echo "Next 200-cycle workflow dispatched."
