name: Strategy Lab research cycle

on:
  workflow_dispatch:
    inputs:
      inst_id:
        description: "OKX Spot USDT instrument (example BTC-USDT)"
        required: true
        default: "BTC-USDT"
      bar:
        description: "Candle interval (5m, 15m, 1H, 4H, 1D)"
        required: true
        default: "1H"
      candles:
        description: "Confirmed historical candles (120-10000)"
        required: true
        default: "1500"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: strategy-lab-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout persistent research state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch OKX candles and evaluate 10 strategies
        env:
          INPUT_INST_ID: ${{ github.event.inputs.inst_id || 'BTC-USDT' }}
          INPUT_BAR: ${{ github.event.inputs.bar || '1H' }}
          INPUT_CANDLES: ${{ github.event.inputs.candles || '1500' }}
        run: |
          python main.py --inst-id "$INPUT_INST_ID" --bar "$INPUT_BAR" --candles "$INPUT_CANDLES"
      - name: Persist memory and latest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lab_memory.json data/latest_cycle.json
          if git diff --cached --quiet; then
            echo "No research state changes to commit."
          else
            git commit -m "Persist Strategy Lab research cycle [skip ci]"
            git push origin HEAD:main
          fi
